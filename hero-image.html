
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hero Block with Image</title>
    <meta name="description" content="An above-the-fold hero block with an image background and animated text.">

    <!-- Student: Bryan Vilchez | Student ID: 81576 -->

    <link rel="preload" href="exercises\assets\img\business.jpg" as="image">

    <!-- Link to Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom styles -->
    <style type="text/tailwindcss">
        header {
            @apply relative min-h-[60vh] md:min-h-[80vh]
                flex flex-col justify-center
                px-8 lg:px-60 py-12
                text-center
                bg-cover bg-center;
            background-image: url('exercises\assets\img\business.jpg');
        }

        header::before {
            content: "";
            @apply absolute inset-0 bg-green-900/40;
        }

        header h1 {
            @apply relative text-7xl md:text-8xl
                text-white font-bold tracking-tight mb-6;
        }

        header h2 {
            @apply relative text-4xl md:text-5xl text-white;
        }

        .slide-in-left {
            animation: slide-in-left 1s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
        }

        @keyframes slide-in-left {
            0% {
                transform: translateX(-1000px);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .slide-in-top {
            animation: slide-in-top 1s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
        }

        @keyframes slide-in-top {
            0% {
                transform: translateY(-1000px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .slide-in-left,
            .slide-in-top {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <!-- Hero block -->
    <header>
        <h1 class="slide-in-top">Albert Camus</h1>
        <h2 class="slide-in-left">Creative Web Developer</h2>
    </header>
    <!-- /hero block -->

</body>
</html>
